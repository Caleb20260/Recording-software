name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LubbInteractiveCreator.csproj

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build release packages
        shell: pwsh
        run: .\package-release.ps1

      - name: Verify portable package exists
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts -Filter 'LubbInteractiveCreator-*.zip' -File
          if (-not $package) {
            throw 'The portable release package was not created.'
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LubbInteractiveCreator-${{ github.ref_name }}
          path: artifacts/**

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/LubbInteractiveCreator-*.zip
            artifacts/installer/LubbInteractiveCreatorSetup-*.exe